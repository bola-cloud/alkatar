      <stop offset="0%" stop-color="#b7d86b" />
      <stop offset="100%" stop-color="#9cc33b" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="transparent" />

  <!-- big 404 background text -->
  <g transform="translate(0,60)">
    <text x="50%" y="210" text-anchor="middle" font-family="sans-serif" font-size="320" font-weight="700" fill="url(#g)" opacity="0.95">404</text>
  </g>

  <!-- simple person illustration (stylized) -->
  <g transform="translate(420,140)">
    <ellipse cx="190" cy="210" rx="80" ry="20" fill="#cfe6a3" opacity="0.6"/>
    <circle cx="150" cy="120" r="60" fill="#ff9b4a"/>
    <path d="M110 145 C120 170, 180 170, 190 145 L190 220 C160 240,120 240,110 220 Z" fill="#ffd2ac" />
    <path d="M100 105 C120 90, 180 90, 200 105" fill="none" stroke="#000" stroke-opacity="0.08" stroke-width="2"/>
    <circle cx="140" cy="115" r="6" fill="#000"/>
    <circle cx="160" cy="115" r="6" fill="#000"/>
    <path d="M138 133 C148 143, 162 143, 172 133" stroke="#7a4a2b" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="224" cy="48" r="24" fill="#fff" stroke="#ff9b4a" stroke-width="6"/>
    <text x="224" y="58" text-anchor="middle" font-size="28" font-weight="700" fill="#ff9b4a">?</text>
  </g>

  <!-- small leaves decorative -->
