services:
  app:
    container_name: SharaaDates
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    ports:
      - "9000:9000"
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql
    environment:
      - DB_HOST=mysql
      - DB_DATABASE=dates
      - DB_USERNAME=root
      - DB_PASSWORD=default
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mysql:
    container_name: SharaaDates_DB
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: default
      MYSQL_DATABASE: dates
    volumes:
      - ./db-data:/var/lib/mysql
    ports:
      - "3306:3306"

  phpmyadmin:
    image: phpmyadmin:5.2.1
    ports:
      - "8080:80"
    environment:
      - PMA_HOST=mysql
      - PMA_ARBITRARY=1
      - UPLOAD_LIMIT=99999K
    depends_on:
      - mysql

  nginx:
    image: nginx:1.21-alpine
    container_name: SharaaDates-nginx
    volumes:
      - .:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8000:80"
    depends_on:
      - app
